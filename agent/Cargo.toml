[package]
name = "agent"
version = "2.0.0"
edition = "2021"

[dependencies]
# Ofuscación de strings en compile-time
obfstr = "0.4"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["dpapi", "wincrypt", "errhandlingapi", "libloaderapi", "memoryapi", "winnt"] }

[[bin]]
name = "agent"
path = "src/main.rs"