[package]
name = "c2r2-server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
colored = "2.1"
prettytable-rs = "0.10"
rustyline = "14.0"

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"