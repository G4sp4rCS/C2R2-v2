[package]
name = "builder"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8"
block-modes = "0.8"
pbkdf2 = "0.10"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
winapi = { version = "0.3", features = ["winerror", "winnt", "winbase", "ntdef", "minwindef", "winuser", "processthreadsapi", "memoryapi", "minwinbase", "synchapi", "handleapi", "errhandlingapi", "wincrypt"] }
rand = "0.8"
cbc = "0.1.2"
clap = { version = "4.0", features = ["derive"] }