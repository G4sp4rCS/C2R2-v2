[package]
name = "c2r2-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2.0"
rcgen = "0.13"
clap = { version = "4.0", features = ["derive"] }
chrono = "0.4"
colored = "2.1"
prettytable-rs = "0.10"
rustyline = "14.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time", "local-time"] }
tracing-appender = "0.2"